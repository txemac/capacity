[project]
name = "capacity-producer"
version = "0.1.0"
description = "Producer application for secure ML model packaging and distribution"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "huggingface-hub>=1.31.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
pythonpath = [
    "src",
]
